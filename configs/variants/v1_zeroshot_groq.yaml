# V1 — zero-shot, cheap model (Groq 8B). Baseline, cheapest. (spec §4.1)
variant_id: V1
prompt_strategy: zero-shot
model: groq
model_name: llama-3.1-8b-instant      # CHEAP/small model (Groq free tier); verify id in console
role: baseline, cheapest
prompt_version: "0.1.0"

# Generation params (spec §13: temp 0, tight max_tokens)
temperature: 0
max_tokens: 500

# Schema representation held constant across variants (see configs/schema_format.yaml)
schema_format: create_table_fk

# System prompt. Confidence is requested for the calibration analysis (spec §12.2).
system_prompt: |
  You are an expert SQL analyst. You are given a SQLite database schema and a
  natural-language question. Write a single SQLite SELECT query that answers it.

  Respond with exactly:
  1. The query inside one ```sql code block.
  2. On a new line after the block: CONFIDENCE: <number from 0.0 to 1.0>
  Do not add explanation.

# zero-shot: no worked examples
few_shot_examples: []
